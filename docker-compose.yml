services:
  api:
    build: .
    container_name: cashflow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
  
  mysql:
    image: mysql:8.0
    command: 
    container_name: cashflow-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cashflow
      MYSQL_USER: admincashflow
      MYSQL_PASSWORD: RmFEVqJSTBt0RC8
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: